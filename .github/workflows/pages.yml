name: pages

# Owner self-hosts the site (npm run build-site); keep this workflow as a
# manual fallback only.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pages may not be enabled on this repo yet. Never fail the run (and
    # spam failure emails) — deploy when possible, no-op otherwise.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Try to enable Pages automatically; tolerate repos where that is not
      # permitted (private repo on a free plan, restricted token).
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      # The dashboard is fully static: index.html + app.js import the policy
      # engine as browser ESM, and live registry status queries Base directly.
      - name: Stage static site
        run: |
          mkdir -p _site/src
          cp index.html console.html app.js styles.css _site/
          cp src/*.mjs _site/src/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
